name: Keep alive

# O plano free do Render dorme após 15 min ocioso. Este ping é só um reforço: o GitHub atrasa
# ou pula agendamentos em repos com pouca atividade, então ele não garante a demo acordada.
# Para isso, use um monitor HTTP externo em /health a cada 5 min.
# /health não toca no banco, então o Neon continua podendo dormir.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: >-
          curl --fail --silent --show-error --max-time 90
          --retry 2 --retry-delay 10
          https://transparenciabr-api.onrender.com/health
