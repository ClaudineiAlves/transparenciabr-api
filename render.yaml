services:
  - type: web
    name: transparenciabr-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      # Postgres no Neon (free, não expira); defina o valor no dashboard do Render.
      - key: DATABASE_URL
        sync: false
      - key: TRANSPARENCIA_API_KEY
        sync: false
