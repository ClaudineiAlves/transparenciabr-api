services:
  - type: web
    name: transparenciabr-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: transparenciabr-db
          property: connectionString
      - key: TRANSPARENCIA_API_KEY
        sync: false

databases:
  - name: transparenciabr-db
    plan: free
